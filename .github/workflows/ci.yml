name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m compileall -q src tests_python examples/python
      - run: python -m unittest discover -s tests_python -v
      - run: cascadelens --version
      - run: cascadelens demo --out work/python-demo-riskpack
      - run: cascadelens verify work/python-demo-riskpack
      - if: matrix.python-version == '3.12'
        run: python -m pip install "build>=1.2,<2" "ruff>=0.9,<1"
      - if: matrix.python-version == '3.12'
        run: python -m ruff check src tests_python examples/python
      - if: matrix.python-version == '3.12'
        run: python -m ruff format --check src tests_python examples/python
      - if: matrix.python-version == '3.12'
        run: python -m build
      - if: matrix.python-version == '3.12'
        run: python -m pip install --force-reinstall --no-deps dist/cascadelens-*.whl

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npm run ci

  reproducible-build:
    name: Reproducible build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:build-reproducibility
