[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cascadelens"
version = "0.6.0"
description = "Evidence-graded systemic-risk analysis in Python"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mingrui Li" }]
keywords = [
  "systemic-risk",
  "scenario-analysis",
  "stress-testing",
  "decision-support",
  "provenance",
  "network-analysis",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
networkx = ["networkx>=3.2,<4"]
notebook = ["jupyterlab>=4,<5", "networkx>=3.2,<4"]
yaml = ["PyYAML>=6,<7"]
dev = [
  "build>=1.2,<2",
  "coverage>=7.10,<8",
  "mypy>=1.14,<2",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
cascadelens = "cascadelens.cli:main"

[project.urls]
Homepage = "https://cascadelens.limingrui2.chatgpt.site"
Documentation = "https://github.com/limingrui679-design/CascadeLens/tree/main/docs"
Repository = "https://github.com/limingrui679-design/CascadeLens"
Issues = "https://github.com/limingrui679-design/CascadeLens/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cascadelens = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests_python"]
addopts = "-ra"

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
source = ["cascadelens"]

[tool.coverage.report]
fail_under = 75
precision = 2
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/cascadelens"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
